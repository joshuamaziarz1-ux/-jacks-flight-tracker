name: JacksFlightTracker
options:
  bundleIdPrefix: com.joshuamaziarz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  JacksFlightTracker:
    type: application
    platform: iOS
    sources:
      - path: JacksFlightTracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuamaziarz.jacksflighttracker
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Jack's Flight Tracker"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
      testTargets: []
