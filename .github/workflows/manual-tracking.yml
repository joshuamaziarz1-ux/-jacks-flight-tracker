name: Test Manual Aircraft Tracking
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'saved-aircraft.js'
      - 'tests/manual-tracking-smoke.mjs'
      - '.github/workflows/manual-tracking.yml'
  workflow_dispatch:
jobs:
  manual-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Test default idle, explicit track, auto-refresh and stop
        run: node tests/manual-tracking-smoke.mjs
      - name: Check alternate USGS map tile (no API key)
        run: |
          python3 - <<'PY'
          import urllib.request
          url='https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/9/190/134'
          req=urllib.request.Request(url,headers={'Accept':'image/png,image/jpeg,image/*'})
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  print('USGS HTTP',r.status,'type',r.headers.get('content-type'))
                  assert r.status==200
                  assert 'image/' in r.headers.get('content-type','')
          except Exception as err:
              print('USGS map tile access may be restricted:',err)
          PY
