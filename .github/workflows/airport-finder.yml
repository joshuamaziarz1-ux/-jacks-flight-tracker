name: Test Fort Wayne Airport Search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'saved-aircraft.js', 'tests/airport-finder-smoke.mjs', '.github/workflows/airport-finder.yml']
jobs:
  airport-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node tests/airport-finder-smoke.mjs
