name: Test iPhone Map Rendering
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vector-map.js'
      - 'tests/ios-webkit-map.mjs'
      - '.github/workflows/webkit-map.yml'
jobs:
  ios-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Start local static app server
        run: |
          python3 -m http.server 9123 > /tmp/jft-server.log 2>&1 &
          sleep 2
      - name: Run real browser map test
        run: node tests/ios-webkit-map.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vector-map-iphone-screenshots
          path: webkit-tracker-*.png
