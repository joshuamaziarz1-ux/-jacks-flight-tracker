name: Inspect No-Key Browser Flight Access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cors-alternate-check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check published CORS and status for no-key providers
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json,time
          sources=[
            ('OpenSky nearby','https://opensky-network.org/api/states/all?lamin=40.75&lomin=-85.8&lamax=41.8&lomax=-84.55'),
            ('AvioADSB nearby','https://avioadsb.org/v1/point/41.13/-85.14/60'),
            ('AvioADSB by reg','https://avioadsb.org/v1/reg/N278DC'),
          ]
          for label,url in sources:
            print('SOURCE',label,flush=True)
            req=urllib.request.Request(url,headers={'Origin':'https://joshuamaziarz1-ux.github.io','Accept':'application/json','User-Agent':'Mozilla/5.0'})
            try:
              with urllib.request.urlopen(req,timeout=15) as r:
                print('HTTP',r.status,'CORS',r.headers.get('access-control-allow-origin'),'Vary',r.headers.get('Vary'),
                  'rate-left',r.headers.get('X-RateLimit-Remaining'),flush=True)
                try:
                  obj=json.load(r)
                  print('aircraft',len(obj.get('ac',[])) if isinstance(obj,dict) else 'n/a',
                    'states',len(obj.get('states') or []) if isinstance(obj,dict) else 'n/a',flush=True)
                except Exception as e:print('unreadable-json',type(e).__name__,flush=True)
            except urllib.error.HTTPError as e:
              print('HTTP_ERROR',e.code,'CORS',e.headers.get('access-control-allow-origin'),
              'retry-after',e.headers.get('Retry-After'),flush=True)
            except Exception as e:print('NETWORK_ERROR',type(e).__name__,str(e)[:120],flush=True)
            time.sleep(11)
          PY